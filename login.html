<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Snifmist</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Top Bar & Header (Simplified for Login) -->
  <header class="site-header" style="top: 0; padding: 2rem 4rem;">
    <div class="header-logo" onclick="window.location.href='index.html'">SNIFMIST</div>
    <div class="header-actions">
      <a href="index.html" class="btn-outline">Back to Home</a>
    </div>
  </header>

  <!-- Stylish Background Elements -->
  <div id="particles-js"></div>
  <div class="bg-gradient"></div>
  <div class="bg-noise"></div>

  <!-- 3D Login Scene -->
  <main class="login-scene">
    <div class="login-card">
      <div class="login-card-inner">
        <h2>Welcome Back</h2>
        <p>Enter your details to access your exclusive account.</p>
        
        <form class="login-form">
          <div class="input-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>
          </div>
          <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>
          </div>
          <div class="form-actions">
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>
          <button type="submit" class="btn-solid login-btn">Sign In</button>
        </form>
        
        <p class="signup-text">Don't have an account? <a href="#">Create one</a></p>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script src="login.js"></script>
</body>
</html>
